name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run Linters
        run: bash lint.sh

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Ensure no uncommitted formatting changes
        run: git diff --exit-code
